<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Feed Page</title>
    <link rel="stylesheet" href="../../src/css/Page.css">
</head>
<body>
    <!-- Top Navbar -->
    <header class="navbar">
        <div class="logo">Logo</div>
        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">Profile</a>
            <a href="#">Messages</a>
            <a href="#">Logout</a>
        </nav>
    </header>

    <div class="container">
        <!-- Left Bar -->
        <aside class="sidebar-left">
            <h3>Menu</h3>
            <ul>
                <li><a href="#">Dashboard</a></li>
                <li><a href="#">Friends</a></li>
                <li><a href="#">Groups</a></li>
                <li><a href="#">Settings</a></li>
            </ul>
        </aside>

        <!-- Feed Center -->
        <main class="feed">
            <div class="new-post">
                <textarea placeholder="What's on your mind?" rows="3"></textarea>
                <button>Post</button>
            </div>



        <!-- just example feed content -->
            <div class="post">
                <div class="post-header">
                    <img src="avatar.png" alt="User Avatar">
                    <div>
                        <h4>User Name</h4>
                        <p>Just now</p>
                    </div>
                </div>
                <p>This is a sample post content...</p>
            </div>

            <div class="post">
                <div class="post-header">
                    <img src="avatar.png" alt="User Avatar">
                    <div>
                        <h4>Another User</h4>
                        <p>5 mins ago</p>
                    </div>
                </div>
                <p>Another sample post content...</p>
            </div>
        </main>





        <!-- Right Sidebar  don know what this to be yet -->
        <aside class="sidebar-right">
            <h3>Updates</h3>
            <ul>
                <li>Update 1</li>
                <li>Update 2</li>
                <li>Update 3</li>
                <li>Update 4</li>
            </ul>
        </aside>
    </div>


    <script src="script.js"></script>
</body>
</html>

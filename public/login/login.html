<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Registration Form</title>
    <link href="http://cdn.lineicons.com/4.0/lineicons.css" rel="stylesheet" />
    <link rel="stylesheet" href="stylelogin.css">
</head>
<body>

    <!-- ++logo  -->
     <!-- <div class="logo-container">
        <img src="img url" alt="Logo" class="logo" id="logo">
        <h3>welcome!!</h3>
    </div> -->


    
    <div class="container" id="container">
        <div class="form-container register-container">
            <form action="#">
                <h1>Register here.</h1>
                <input type="text" placeholder="Name" required>
                <input type="email" placeholder="Email or phone number" required>
                <input type="password" id="password" placeholder="Password" required 
                       pattern="(?=.*\d)(?=.*[A-Z]).{8,}" 
                       title="Password must be at least 8 characters long, contain at least one uppercase letter, and one number">
              
                <!-- confirm pass, gender and birthday -->
                <input type="password" placeholder="Confirm Password" required> 
                <input type="date" placeholder="Birthday" required>
                <input type="text" placeholder="Gender" list="gender-options" required>
                <datalist id="gender-options">
                    <option value="Male">
                    <option value="Female">
                    <option value="God">
                    <option value="Unicon">
                    <option value="Thai">I am Thai and Thai mean Freedom...</option>
                    <option value="Suuuuuuu">Don't wanna tell...</option>
                    <option value="Other">
                </datalist>

                <button>Register</button>
                    

            </form>
        </div>

        <div class="form-container login-container">
            <form action="#">
                <h1>Login here.</h1>
                <input type="email" placeholder="Email or phone number">
                <input type="password" placeholder="Password">
                <div class="content">
                    <div class="checkbox">
                        <input type="checkbox" name="checkbox" id="checkbox">
                        <label>Remember me</label>
                    </div>
                <div class="pass-link"> 
                    <a href="#">Forgot password?</a>
                  </div>
                </div>
                <button>Login</button>
                <span>or use your account</span>

                <!-- add social link -->
                <div class="social-container">
                    <div class="social-links">
                        <a href="#" class="social-button-google">
                            <img src="https://pngimg.com/d/google_PNG19635.png" alt="Google">
                        </a>
                        <a href="#" class="social-button-facebook">
                            <img src="https://static.vecteezy.com/system/resources/previews/018/930/698/original/facebook-logo-facebook-icon-transparent-free-png.png" alt="Facebook">
                        </a>
                        <a href="#" class="social-button-instagram">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Instagram_icon.png/1200px-Instagram_icon.png" alt="Instagram">
                        </a>
                    </div>
                </div>
                
            </form>
        </div>

        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1 class="title">Hello <br>There</h1>
                    <p>if you have an account, login here</p>
                    <button class="ghost" id="login">Login
                        <i class="Ini Ini-arrow-left login"></i>
                    </button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1 class="title">Start your <br> journey</h1>
                    <p>if you don't have an account yet why not have one?</p>
                    <button class="ghost" id="register">Register
                        <i class="Ini Ini-arrow-right register"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="scriptLogin.js"></script>


</body>
</html>
